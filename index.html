<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="Uma roleta interativa para sortear 16 temas.">
  <title>Roleta de Temas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="stage" aria-label="Roleta de 16 temas">
    <div class="wheel" aria-label="Roleta de temas">
      <div id="wheelSpin" class="wheel-rotator" aria-hidden="true">
        <svg id="wheelSvg" viewBox="-300 -300 600 600" role="presentation" focusable="false"></svg>
      </div>
      <div class="wheel-pointer" aria-hidden="true">
        <svg viewBox="0 0 44 58" fill="none">
          <path d="M22 55L2.5 13.5C0 8 4 2 10 2H34C40 2 44 8 41.5 13.5L22 55Z" fill="#E6B783" stroke="#253830" stroke-width="3"/>
          <path d="M22 43L12 12H32L22 43Z" fill="#F3DFC0"/>
        </svg>
      </div>
      <button id="spinButton" class="wheel-center" type="button" aria-label="Girar a roleta">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.5C12 8.15 15.85 12 21.5 12C15.85 12 12 15.85 12 21.5C12 15.85 8.15 12 2.5 12C8.15 12 12 8.15 12 2.5Z" fill="currentColor"/>
        </svg>
        <span>GIRAR</span>
      </button>
    </div>
    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="app.js?v=3" defer></script>
</body>
</html>
